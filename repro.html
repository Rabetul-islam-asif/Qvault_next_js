<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Component Repro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 p-4">
    <div class="mt-8 relative max-w-lg mx-auto">
        <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur opacity-25"></div>
        <div class="relative bg-white rounded-xl shadow-xl p-2 flex items-center border border-slate-100">
            <i class="fas fa-search text-slate-400 ml-4 text-lg"></i>
            <input 
                type="text" 
                placeholder="Search for courses, papers..." 
                class="flex-1 bg-transparent border-none focus:ring-0 outline-none text-slate-700 placeholder-slate-400 h-12 px-4 text-base font-medium"
                value=""
            />
            <button 
                class="bg-slate-900 text-white px-4 sm:px-6 h-12 rounded-lg font-bold hover:bg-slate-800 transition-all shadow-lg shadow-slate-900/20 flex items-center justify-center"
            >
                Find
            </button>
        </div>
    </div>
</body>
</html>
